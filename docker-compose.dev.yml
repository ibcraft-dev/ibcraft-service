services:
  db_ibcraft:
    image: postgres:16
    container_name: postgres-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dragondev
      POSTGRES_DB: ibcraftdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ibcraftdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend_ibcraft:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: backend-ibcraft-dev
    env_file:
      - .env.dev
    working_dir: /src
    depends_on:
      db_ibcraft:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__IbCraftDbContext: Host=db_ibcraft;Port=5432;Username=postgres;Password=dragondev;Database=ibcraftdata;Include Error Detail=True;
      Clientaddress: http://localhost:3000
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    ports:
      - "8080:8080"
    volumes:
      - .:/src
      - nuget_packages:/root/.nuget/packages
    command: >
      sh -c "dotnet restore ibcraftservice/ibcraft.API.csproj &&
      dotnet watch --project ibcraftservice/ibcraft.API.csproj run --urls http://0.0.0.0:8080 --migrate"

  frontend_ibcraft:
    image: node:20-alpine
    container_name: frontend-ibcraft-dev
    working_dir: /app
    depends_on:
      - backend_ibcraft
    environment:
      NEXT_PUBLIC_DEVMODE: development
      NEXT_PUBLIC_SERVER_URL_HTTP: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./Ibcraft.UI:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: >
      sh -c "npm install &&
      npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data_dev:
  nuget_packages:
  frontend_node_modules:
  frontend_next:
